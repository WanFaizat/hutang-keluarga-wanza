<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d6dff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Hutang Keluarga WANZA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: ceria, ringan dan kemas, macam app keluarga yang mesra
   IDEA: buku hutang keluarga berwarna pastel: merah = baki, hijau = dah bayar, biru = maklumat
   PICTURE: kad utama putih dengan gelembung RGB pastel dan cincin peratus berwarna
   COLOUR and TYPE: putih cerah, merah jambu koral, hijau pudina, biru langit, kuning cerah; Plus Jakarta Sans
   LAYOUT: lajur tunggal mesra iPhone, ikon dalam petak pastel, nav terapung */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121426);--panel:light-dark(#ffffff,#1b1e33);--soft:light-dark(#f3f5fa,#242842);--ink:light-dark(#23253a,#eceefa);
--mute:light-dark(#7b809b,#9aa0c0);--line:light-dark(#e8ebf3,#2b2f4c);
--R:#ff6b8a;--Rs:light-dark(#ffe6ec,#3a2433);--G:#2fc483;--Gs:light-dark(#dcf7ea,#1d3a31);--B:#4b7bff;--Bs:light-dark(#e4ecff,#222c4d);--Y:#ffb932;--Ys:light-dark(#fff3d9,#3a3222);--P:#9a7bff;--Ps:light-dark(#efeaff,#2c2648);
--forest:var(--B);--brand:var(--B);--sage:var(--G);--gold:light-dark(#e79a10,#ffc85c);--red:var(--R);--ok:light-dark(#1fa86c,#4fd99a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.ttl b{display:block;font-size:19px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.ttl span{font-size:12px;color:var(--mute);font-weight:600}
.sulit{color:var(--red)!important}
.tr{display:flex;align-items:center;gap:8px;flex:none}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 10px;cursor:pointer;min-height:34px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.ok i{background:var(--G)}.sync.busy i{background:var(--Y);animation:blink 1s infinite}.sync.err i{background:var(--red)}
.lang{display:flex;background:var(--soft);border-radius:99px;padding:3px}
.lang button{border:0;background:none;padding:5px 10px;border-radius:99px;font-weight:700;font-size:12px;min-height:30px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hero{position:relative;overflow:hidden;background:var(--panel);color:var(--ink);border-radius:28px;padding:22px 20px 18px;box-shadow:0 12px 34px rgba(75,123,255,.12);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;width:150px;height:150px;right:-50px;top:-60px;border-radius:50%;background:var(--Rs);opacity:.8;animation:drift 10s ease-in-out infinite alternate}
.hero .bl{position:absolute;width:200px;height:200px;border-radius:50%;pointer-events:none;animation:drift 12s ease-in-out infinite alternate-reverse}
.hero::after{content:"";position:absolute;width:120px;height:120px;left:-50px;bottom:-60px;border-radius:50%;background:var(--Gs);opacity:.8}
.hgrid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.hl{font-size:13px;font-weight:600;color:var(--mute)}
.big{color:var(--R);font-size:clamp(30px,8.5vw,42px);font-weight:800;line-height:1.05;white-space:nowrap;letter-spacing:-.8px;margin:4px 0 2px}
.donut{width:118px;height:118px;position:relative}
.dtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dt{border:1.5px dashed var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:10px 6px;display:grid;justify-items:center;gap:6px;font:inherit;font-size:12px;font-weight:700;line-height:1.25;text-align:center;cursor:pointer;transition:transform .15s}.dt:active{transform:scale(.96)}.dt svg{width:20px;height:20px;color:var(--B)}.dt.ok{border-style:solid;border-color:var(--G)}.dt.ok svg{color:var(--G)}
.lgd{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px;font-weight:600}.lgd span{display:inline-flex;align-items:center;gap:6px}.lgd i{width:12px;height:12px;border-radius:4px;display:inline-block}
.pet summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}.pet summary::-webkit-details-marker{display:none}.pet ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}.pet li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}.pet li i{flex:0 0 auto;min-width:26px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:#fff}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:13}.donut .b{stroke:var(--R);opacity:.45}.donut .f{stroke:var(--G);stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.donut b{position:absolute;inset:0;display:grid;place-content:center;font-size:20px;font-weight:800;color:var(--ink);line-height:1.1;text-align:center}.donut b small{display:block;font-size:11px;font-weight:700;opacity:.8;margin-top:2px}
.hstats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.hstats div{border-radius:16px;padding:9px 10px}.hstats div:nth-child(1){background:var(--Bs)}.hstats div:nth-child(2){background:var(--Gs)}.hstats div:nth-child(3){background:var(--Ys)}.hstats small{display:block;font-size:11px;color:var(--mute)}.hstats b{font-size:14px;white-space:nowrap}
.quote{position:relative;z-index:1;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);min-height:58px}
.quote p{margin:0;font-size:14px;font-weight:600;line-height:1.4;transition:opacity .5s,transform .5s}
.quote small{display:block;font-size:11px;color:var(--R);font-weight:700;margin-top:3px;transition:opacity .5s}
.quote.out p,.quote.out small{opacity:0;transform:translateY(5px)}
.qa4{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:14px}
.qa4 button,.qa4 a{display:grid;justify-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 4px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;cursor:pointer;transition:transform .2s}
.qa4 button:active,.qa4 a:active{transform:scale(.95)}
.qa4 svg{width:40px;height:40px;padding:9px;border-radius:14px}.qa4>:nth-child(1) svg{background:var(--Rs);color:var(--R)}.qa4>:nth-child(2) svg{background:var(--Bs);color:var(--B)}.qa4>:nth-child(3) svg{background:var(--Gs);color:var(--G)}.qa4>:nth-child(4) svg{background:var(--Ys);color:var(--gold)}
h2{font-size:18px;margin:26px 0 10px;line-height:1.2;letter-spacing:-.2px}
.sub{color:var(--mute);font-size:14px;margin:-4px 0 12px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.hrow a,.hrow>button{font-size:13px;font-weight:700;color:var(--brand);background:none;border:0;cursor:pointer;text-decoration:none;white-space:nowrap;flex:none}.hrow .chips{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mc{flex:0 0 132px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 10px 12px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s;font:inherit;color:inherit}
.mc.on{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.mc:active{transform:scale(.96)}
.mc b{display:block;font-size:14px;margin-top:8px}.mc span{display:block;font-size:11px;color:var(--mute)}.mc .owe{font-weight:800;font-size:13px;margin-top:3px;white-space:nowrap}
.av{position:relative;width:70px;height:70px;margin:0 auto}
.av svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.av circle{fill:none;stroke-width:4}.av .bg{stroke:var(--line)}.av .fg{stroke:var(--G);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.av .ph{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:800;font-size:19px;background-size:cover;background-position:center}
.av.sm{width:50px;height:50px;flex:none}.av.sm .ph{inset:5px;font-size:14px}
.neg{color:var(--red)}.pos{color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 13px;min-height:38px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--mute);transition:all .2s}
.chips button.on{background:var(--B);border-color:var(--B);color:#fff}
.search{position:relative;margin:4px 0 8px}.search input{padding-left:40px}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.list{display:grid;gap:8px}
.it{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:box-shadow .25s}
.it.open{box-shadow:0 8px 24px rgba(18,40,31,.1)}
.ih{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:13px 14px;background:none;border:0;text-align:left;cursor:pointer}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--Bs);color:var(--B)}
.ico.c1{background:var(--Ps);color:var(--P)}.ico.c2{background:var(--Ys);color:var(--gold)}.ico.c3{background:var(--Bs);color:var(--B)}
.ico.r{background:var(--Rs);color:var(--R)}.ico.g{background:var(--Gs);color:var(--ok)}
.nm{font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl{font-size:12px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;font-size:15px;white-space:nowrap;text-align:right}.amt small{display:block;font-size:11px;font-weight:600;color:var(--mute)}
.thin{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 14px 12px}.thin i{display:block;height:100%;width:0;background:var(--G);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}.more>.mi{overflow:hidden;padding:0 14px;opacity:0;transition:opacity .3s,padding .35s}
.it.open .more{grid-template-rows:1fr}.it.open .more>.mi{opacity:1;padding:0 14px 14px;border-top:1px dashed var(--line)}
.ih:active{transform:scale(.985)}.ih{transition:transform .15s}
.sec{margin-top:12px}.sec h5{margin:0 0 4px;font-size:12px;color:var(--P);font-weight:800}
.kv{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:2px 10px;font-size:13px}.kv span{color:var(--mute)}.kv b{font-weight:600;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--Bs);color:var(--B);white-space:nowrap}
.chip.r{background:var(--Rs);color:var(--R)}.chip.y{background:var(--Ys);color:var(--gold)}.chip.g{background:var(--Gs);color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:13px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer;background:var(--forest);color:#fff;text-decoration:none;display:inline-grid;place-items:center;font-size:15px}
.btn.gd{background:var(--R);color:#fff}.btn.gh{background:var(--soft);color:var(--ink)}.btn.gr{background:var(--G);color:#fff}.btn.dg{background:var(--red)}.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rank{width:40px;height:40px;border-radius:14px;display:inline-grid;place-items:center;font-weight:800;font-size:15px;background:var(--Rs);color:var(--R)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{border:0;background:none;border-radius:11px;padding:8px 4px;font-weight:700;font-size:13px;min-height:40px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.bar .tk{grid-column:1/-1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar .tk i{display:block;height:100%;width:0;background:var(--R);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar b{white-space:nowrap}
.pay{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.pay:last-child{border:0}
.pay .d{width:36px;height:36px;border-radius:12px;background:var(--Gs);display:grid;place-items:center;color:var(--ok);font-weight:800}
.steps{display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;width:100%}
.step .ck{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;transition:all .25s}
.step.done .ck{background:var(--G);border-color:var(--G)}.step.done .tx{opacity:.55;text-decoration:line-through}
.tl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:14px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--sage)}
.ar{font-family:"Noto Naskh Arabic",sans-serif;font-size:22px;line-height:1.9;direction:rtl;text-align:right;margin:6px 0}
.src{font-size:12px;font-weight:700;color:var(--gold)}
.qa{border-bottom:1px solid var(--line);padding:11px 0}.qa:last-child{border:0}.qa b{display:block;margin-bottom:3px}
.nq{display:flex;gap:12px;align-items:flex-start}.no{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px}
.n1{background:var(--Rs);color:var(--R)}.n2{background:var(--Bs);color:var(--B)}.n3{background:var(--Gs);color:var(--ok)}.n4{background:var(--Ys);color:var(--gold)}.n5{background:var(--Ps);color:var(--P)}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.lnk:last-child{border:0}.lnk b{display:block;font-size:15px}.lnk span{font-size:12px;color:var(--mute)}.lnk i{font-style:normal;color:var(--B);font-weight:800}
.lnk .li{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px}
.ckl{display:grid;gap:8px}.ckl .step{align-items:flex-start}.ckl .step small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.ic{font-weight:700;letter-spacing:.4px;white-space:nowrap}
.note{font-size:13px;color:var(--mute)}
.banner{background:color-mix(in srgb,var(--gold) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:16px;padding:12px 14px;font-size:13px;margin-top:12px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:6px;z-index:5;box-shadow:0 10px 30px rgba(18,40,31,.14)}
nav a{text-decoration:none;color:var(--mute);font-size:10.5px;font-weight:700;display:grid;place-items:center;gap:1px;min-height:50px;border-radius:18px;text-align:center;transition:all .25s}
nav a.on{color:var(--B);background:var(--Bs)}
body.fam .adm{display:none!important}body.login nav,body.login #fab{display:none!important}.lgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.lw{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:12px 6px;display:grid;justify-items:center;gap:6px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .2s}.lw.on{border-color:var(--B);box-shadow:0 0 0 3px var(--Bs)}.lw:active{transform:scale(.96)}.lw b{font-size:13px}body.fam .step{pointer-events:none}
.role{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--Ps);color:var(--P);margin-left:6px;vertical-align:middle}nav svg{width:21px;height:21px}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:20px;border:0;background:var(--R);color:#fff;font-size:28px;font-weight:500;box-shadow:0 10px 24px rgba(255,107,138,.4);cursor:pointer;z-index:6;transition:transform .2s}
.fab:active{transform:scale(.92)}
.ov{position:fixed;inset:0;background:rgba(10,18,14,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet h4{margin:20px 0 0;color:var(--P);font-size:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:11px 0 5px}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--bg);min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hist{font-size:14px;border-top:1px solid var(--line);margin-top:14px;padding-top:8px}
.hist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:20;animation:up .3s ease-out;max-width:90vw;text-align:center}
.cf{position:fixed;top:-12px;width:9px;height:13px;border-radius:2px;z-index:30;pointer-events:none;animation:fall 2.4s linear forwards}

function dueTag(d){const n=days(d);if(n===null)return '';const c=n<0?'R':n<=30?'R':n<=60?'Y':'G';
  const txt=n<0?(L()?`${-n} days late`:`Lewat ${-n} hari`):n===0?(L()?'Today':'Hari ini'):(L()?`${n} days left`:`${n} hari lagi`);

  :`<p class="note">${L()?'Only the owner or Faizat can change these numbers.':'Hanya pemilik atau Faizat boleh ubah angka ini.'}</p><div class="acts"><button class="btn gh" data-close>${L()?'Close':'Tutup'}</button></div>`}`);

    const o={row:e.row,g:num(g('zG')),hg:num(g('zH')),haul:g('zHa'),zb:num(g('zB')),zd:g('zD'),tempat:g('zT'),nota:g('zN'),k:isoD()};

    if(o.row)write(()=>gs('update_values',{range:`'Emas & Zakat'!B${o.row}:I${o.row}`,values:[[o.g||'',o.hg||'',tx(o.haul),o.zb||'',tx(o.zd),o.tempat,o.nota,tx(o.k)]]}))}}

  if(!b||isNaN(b))return null;const n0=new Date();let a=n0.getFullYear()-b.getFullYear();if(n0<new Date(n0.getFullYear(),b.getMonth(),b.getDate()))a--;return a}

function plan(list,budget){if(budget<=0)return null;const d=list.filter(i=>num(i.baki)>0).map(i=>({i,b:num(i.baki)})).sort((a,b)=>a.b-b.b);

  <div class="two"><div><label for="pBy">${L()?'Paid by':'Dibayar oleh'}</label><select id="pBy">${MEM.map(m=>{const fn=((S.fam[m.n]||{}).icName||m.n).toUpperCase();return `<option value="${esc(fn)}">${esc(fn)}</option>`}).join('')}</select></div><div><label for="pTo">${L()?'Received by':'Diterima oleh'}</label><input id="pTo" maxlength="80" style="text-transform:uppercase" value="${esc((i.dead==='Y'&&i.wN?i.wN:(i.fname||i.name)).toUpperCase())}"></div></div>
  <label for="pRef">${L()?'Transaction / reference no.':'No. transaksi / rujukan'}</label><input id="pRef" maxlength="60" placeholder="${L()?'From bank receipt':'Dari resit bank'}">
  <label for="pNota">${t('nota')}</label><input id="pNota" maxlength="200">
  <label for="pFile">${t('resitL')}</label><input id="pFile" type="file" accept="image/*">
  <div class="acts"><button class="btn${i.type==='hutang'?'':' gd'}" type="submit">${t('rekod')}</button><button class="btn gh" type="button" data-close>${t('batal')}</button></div></form>
  ${i.type==='hutang'&&num(i.baki)>0?`<div class="acts"><button class="btn gh" id="halal">${t('halal')}</button></div>`:''}
  <div class="hist"><b>${t('sejarah')}</b>${(i.pays||[]).length?i.pays.slice().reverse().map(p=>`<div style="align-items:flex-start;border-bottom:1px dashed var(--line);padding:8px 0"><span><b style="display:block">${fdt(p.d,p.tm)}${p.h?' · '+t('stD'):''}</b><span class="sl" style="display:block;white-space:normal">${[p.cara?caraN(p.cara):'',p.by?(L()?'By ':'Oleh ')+esc(p.by):'',p.to?(L()?'To ':'Kepada ')+esc(p.to):'',p.ref?'Ref '+esc(p.ref):'',esc(p.nota||'')].filter(Boolean).join(' · ')}</span>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">${t('lihatResit')}</a>`:''}</span><span style="display:flex;gap:6px;align-items:center"><b style="white-space:nowrap">${rm(p.a)}</b>${p.row?`<button class="btn gh sm" data-undo="${p.row}">${t('buang')}</button>`:''}</span></div>`).join(''):`<div class="note">${t('tiadaB')}</div>`}</div>`);
  {const ow=MEM.find(m=>(i.who||'').split('|')[0]===m.n);if(ow)sheet.querySelector('#pBy').value=((S.fam[ow.n]||{}).icName||ow.n).toUpperCase();if(i.cara)sheet.querySelector('#pCara').value=i.cara}
  sheet.querySelector('#p').onsubmit=async e=>{e.preventDefault();const qv=k=>sheet.querySelector(k).value.trim();const a=num(qv('#pAmt'));if(a<=0)return;const d=qv('#pDate')||iso,f=sheet.querySelector('#pFile').files[0];
    const tm=qv('#pTm'),cara=qv('#pCara'),by=qv('#pBy'),to=qv('#pTo').toUpperCase(),ref=qv('#pRef'),nota=qv('#pNota');
    const pr={d,a,tm,cara,by,to,ref,nota};i.pays=i.pays||[];i.pays.push(pr);i.baki=Math.max(0,+(num(i.baki)-a).toFixed(2));cache();close();render();done(i);
    write(async()=>{let link='';if(f&&mcp){toast(t('naik'));try{const b64=await shrink(f);const r=await call('Google Drive','create_file',{title:`Resit ${i.name} ${d}.jpg`,base64Content:b64,contentMimeType:'image/jpeg',parentId:RESIT,disableConversionToGoogleType:true});
        link=r&&(r.viewUrl||(r.id?'https://drive.google.com/file/d/'+r.id+'/view':''))||'';if(!/^https:\/\//.test(link))link=''}catch(x){}}
      await gs('append_values',{range:'Bayaran!A1',values:[[tx(d),i.id,i.name,a,'Bayaran',link,tx(isoD()),tx(tm),CARA[cara]||'',by,to,tx(ref),nota]]});
      await gs('update_values',{range:`Hutang!AA${i.row}`,values:[[tx(isoD())]]})})};
  const h=sheet.querySelector('#halal');if(h){let armed=false;h.onclick=()=>{if(!armed){armed=true;h.textContent=t('sahkan');return}
    const a=num(i.baki);i.pays.push({d:iso,a,h:1});i.baki=0;cache();close();render();done(i);
    write(()=>gs('append_values',{range:'Bayaran!A1',values:[[tx(iso),i.id,i.name,a,'Dihalalkan','',tx(iso),'','','',(i.dead==='Y'&&i.wN?i.wN:i.name).toUpperCase(),'',L()?'Forgiven':'Dihalalkan oleh pemiutang']]}))}}
  sheet.querySelectorAll('[data-undo]').forEach(b=>{let armed=false;b.onclick=()=>{if(!armed){armed=true;b.textContent='?';return}const row=+b.dataset.undo,p=i.pays.find(x=>x.row===row);
    if(p){i.pays=i.pays.filter(x=>x!==p);i.baki=+(num(i.baki)+num(p.a)).toFixed(2)}cache();close();render();write(()=>gs('update_values',{range:`Bayaran!D${row}:E${row}`,values:[[0,'Dibatalkan']]}))}})}
function prof(n){const m=MEM.find(x=>x.n===n),f=famOf(n);
  open(`<h3 style="text-transform:uppercase">${esc(m.n)}</h3><form id="pf"><label for="pIc">${t('ic')}</label><input id="pIc" inputmode="numeric" maxlength="14" placeholder="000000-00-0000" value="${esc(f.ic||'')}" autocomplete="off">
  <label for="pNk">${L()?'Nickname':'Nama panggilan'}</label><input id="pNk" maxlength="40" value="${esc(f.nick||m.s)}">
  <label for="pNi">${t('namaIC')}</label><input id="pNi" maxlength="100" value="${esc(f.icName||'')}" style="text-transform:uppercase">
  <div class="two"><div><label for="pTel">${t('tel')}</label><input id="pTel" inputmode="tel" value="${esc(f.tel||'')}"></div><div><label for="pEm">${t('emel')}</label><input id="pEm" type="email" value="${esc(f.email||'')}"></div></div>
  <label for="pAi">${t('alamatIC')}</label><textarea id="pAi" rows="2" maxlength="200" style="text-transform:uppercase">${esc(f.addrIC||'')}</textarea>
  <label for="pAd">${t('alamatSurat')}</label><textarea id="pAd" rows="2" maxlength="200">${esc(f.addr||'')}</textarea>
  <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin-top:8px"><input type="checkbox" id="pSame" style="width:20px;height:20px;min-height:0" ${f.addr&&f.addr===f.addrIC?'checked':''}>${t('samaIC')}</label>
  <label for="pJob">${t('pekerjaan')}</label><input id="pJob" maxlength="80" value="${esc(f.job||'')}">
  <div class="two"><div><label for="pBn">${t('bankN')}</label><select id="pBn"><option value="">-</option>${BANKS.map(b=>`<option>${esc(b)}</option>`).join('')}</select></div><div><label for="pBk">${t('noAk')}</label><input id="pBk" inputmode="numeric" maxlength="30" value="${esc(f.bankNo||'')}"></div></div>
  <label for="pGd">${t('gTarikh')}</label><input id="pGd" type="date" value="${esc(f.gdate||'')}">
  <label for="pGn">${t('gNota')}</label><textarea id="pGn" rows="2" maxlength="200">${esc(f.goal||'')}</textarea>
  <div class="acts"><button class="btn" type="submit">${t('simpan')}</button><button class="btn gh" type="button" data-close>${t('batal')}</button></div></form>`);
  const q=k=>sheet.querySelector(k);q('#pBn').value=BANKS.includes(f.bankN)?f.bankN:'';
  const same=()=>{if(q('#pSame').checked){q('#pAd').value=q('#pAi').value;q('#pAd').disabled=true}else q('#pAd').disabled=false};same();q('#pSame').onchange=same;q('#pAi').oninput=same;
  q('#pf').onsubmit=e=>{e.preventDefault();const v=k=>q(k).value.trim();
    Object.assign(f,{nick:v('#pNk'),ic:v('#pIc'),icName:v('#pNi').toUpperCase(),tel:v('#pTel'),email:v('#pEm'),addrIC:v('#pAi').toUpperCase(),addr:q('#pSame').checked?v('#pAi').toUpperCase():v('#pAd'),job:v('#pJob'),bankN:v('#pBn'),bankNo:v('#pBk'),gdate:v('#pGd'),goal:v('#pGn'),age:''});cache();close();render();
    const row=f.row||MEM.indexOf(m)+2;write(()=>gs('update_values',{range:`Keluarga!D${row}:T${row}`,values:[[tx(f.ic),null,null,tx(f.gdate),f.goal,null,null,null,f.icName,tx(f.tel),f.email,f.addr,f.job,f.bankN,tx(f.bankNo),f.addrIC,f.nick]]}))}}
function b64of(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>res(String(rd.result).split(',')[1]);rd.readAsDataURL(file)})}
function docForm(n,pre,pf){const m=MEM.find(x=>x.n===n),f=S.fam[n]||{};
  open(`<h3>${t('tambahDok')}</h3><div class="note">${esc(m.n)}</div><form id="df">
  <label for="dJ">${t('jenisSem')}</label><select id="dJ">${JSEM.map(j=>`<option>${esc(j)}</option>`).join('')}</select>
  <div class="two"><div><label for="dD">${t('tarikhB')}</label><input id="dD" type="date" value="${isoD()}"></div><div><label for="dK">${t('kos')}</label><input id="dK" inputmode="decimal"></div></div>
  <label for="dR">${t('keputusan')}</label><input id="dR" maxlength="80" placeholder="TIDAK BANKRAP">
  <label for="dF">${t('rujukan')}</label><input id="dF" maxlength="60">
  <label for="dFile">${t('fail')}</label><input id="dFile" type="file" accept="application/pdf,image/*">
  <p class="note neg" id="dErr"></p>
  <div class="acts"><button class="btn" type="submit">${t('simpan')}</button><button class="btn gh" type="button" data-close>${t('batal')}</button></div></form>`);
  const q=k=>sheet.querySelector(k);if(pre)q('#dJ').value=pre;if(pf){q('#dFile').parentNode&&(q('#dFile').outerHTML=`<div class="note">${esc(L()?'File ready':'Fail sedia')} </div>`);q('#dR').value='DIMUAT NAIK'}
  q('#df').onsubmit=e=>{e.preventDefault();const j=q('#dJ').value,d=q('#dD').value||isoD(),res=q('#dR').value.trim(),ref=q('#dF').value.trim(),cost=num(q('#dK').value),fEl=q('#dFile'),file=fEl&&fEl.files?fEl.files[0]:null;
    if(!j||!res){q('#dErr').textContent=t('wajibDok');return}
    const doc={who:n,icName:f.icName||'',jenis:j,d,res,ref,cost,link:''};S.docs.push(doc);cache();close();render();
    write(async()=>{let link='';const ff=pf?pf.file:file;if(ff&&mcp){toast(t('naikDok'));try{const isPdf=pf?pf.isPdf:ff.type==='application/pdf';const b64=pf?pf.b64:(isPdf?await b64of(ff):await shrink(ff));
        const r=await call('Google Drive','create_file',{title:`${j.split(' (')[0]} ${m.s} ${d}.${isPdf?'pdf':'jpg'}`,base64Content:b64,contentMimeType:isPdf?'application/pdf':'image/jpeg',parentId:DOCS,disableConversionToGoogleType:true});
        link=r&&(r.viewUrl||(r.id?'https://drive.google.com/file/d/'+r.id+'/view':''))||'';if(!/^https:\/\//.test(link))link=''}catch(x){}}
      await gs('append_values',{range:'Semakan!A1',values:[[m.s,f.icName||'',j,tx(d),res,tx(ref),cost||'',link,tx(isoD()),'Admin (Faizat)']]})})}}
let photoFor=null;const pin=document.getElementById('photoIn');
pin.onchange=()=>{if(photoFor&&photoFor.startsWith('c:')){const id=photoFor.slice(2),file=pin.files&&pin.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),z=140;c.width=c.height=z;const s0=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-s0)/2,(img.height-s0)/2,s0,s0,0,0,z,z);S.cph[id]=c.toDataURL('image/jpeg',.78);saveCph();render();pin.value=''};img.src=rd.result};rd.readAsDataURL(file);return}
  const file=pin.files&&pin.files[0];if(!file||!photoFor)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),z=180;c.width=c.height=z;const s=Math.min(img.width,img.height);
  c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,z,z);S.photos[photoFor]=c.toDataURL('image/jpeg',.8);savePrefs();render();pin.value=''};img.src=rd.result};rd.readAsDataURL(file)};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('form')&&b.type==='submit')return;const d=b.dataset;
  if(b.id==='fab'||d.act==='add')form();else if(d.act==='pay'){const r=rank(H(''));location.hash='keutamaan';if(r[0])setTimeout(()=>pay(r[0].id),60)}
  else if(b.id==='lBM'||b.id==='lEN'){S.lang=b.id==='lEN'?'en':'bm';savePrefs();render();setSync(online?'ok':'')}
  else if(b.id==='set')settings();
  else if(d.setk){const k=d.setk,v=d.setv;if(k==='lang'){S.lang=v;setSync(online?'ok':'')}else S[k]=v==='1'?true:v==='0'?false:v;savePrefs();cache();render();settings()}
  else if(b.id==='eye'){S.hide=!S.hide;cache();render();toast(S.hide?(L()?'Amounts hidden':'Jumlah disorok'):(L()?'Amounts shown':'Jumlah dipaparkan'))}
  else if(b.id==='theme'){S.theme=S.theme==='dark'?'light':'dark';savePrefs();theme()}
  else if(b.id==='sync')(isOwner?pull():pullPublic());else if(b.id==='copySum')copy(summary());
  else if(d.open){const it=b.closest('.it');if(opened.has(d.open)){opened.delete(d.open);it.classList.remove('open')}else{opened.add(d.open);it.classList.add('open')}b.setAttribute('aria-expanded',opened.has(d.open))}
  else if(d.pay)pay(d.pay);else if(d.edit)form(d.edit);
  else if(d.kat){S.mode='pintar';savePrefs();location.hash==='#keutamaan'?render():location.hash='keutamaan'}
  else if(d.jump){opened.add(d.jump);S.who='';S.flt='aktif';S.q='';S.sub='hutang';location.hash='hutang';setTimeout(()=>{const el=document.querySelector(`[data-it="${CSS.escape(d.jump)}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},120)}
  else if(d.go!==undefined){S.who=d.go;S.sub='hutang';cache();location.hash==='#hutang'?render():location.hash='hutang'}
  else if(d.who!==undefined){S.who=d.who;cache();render()}
  else if(d.sub){S.sub=d.sub;cache();render()}else if(d.flt){S.flt=d.flt;cache();render()}
  else if(d.mode){S.mode=d.mode;savePrefs();render()}
  else if(d.step!==undefined){S.steps[d.step]=!S.steps[d.step];savePrefs();render();if(S.steps[d.step])confetti()}
  else if(d.prof)prof(d.prof);else if(d.eye){showIC[d.eye]=!showIC[d.eye];render()}
  else if(d.cak){const it=S.items.find(x=>x.id===d.cak);if(it)copy(String(it.bank).replace(/\s/g,''),t('akDisalin'))}
  else if(d.cic){copy(String((S.fam[d.cic]||{}).ic||'').replace(/\D/g,''),t('icDisalin'))}
  else if(d.photo){photoFor=d.photo;pin.click()}
  else if(d.doc)docForm(d.doc);
  else if(d.lw){lgWho=d.lw;render()}   else if(d.aset!==undefined){asetForm(d.aset)}   else if(d.zakat){zakatOpen(d.zakat)}   else if(d.rpin){adminResetPin(d.rpin)}   else if(b.id==='bPin'){pinForm('',false)}   else if(b.id==='bOut'){logout()}   else if(d.dw){dokWho=d.dw;render()}   else if(d.fup){famUpload(d.fup,d.j)}   else if(d.alld){dokWho=d.alld;location.hash='dokumen'}
  else if(d.up){famUpload(dokWho||MEM[0].n,d.up)}
  else if(b.hasAttribute('data-close'))close()});
ov.addEventListener('click',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
setSync('');render();connect();
}
